# Эталонный набор разговорных фраз мастера → ожидаемые позиции сметы.
#
# row — номер строки на листе (см. tests/fixtures/sample.xlsx), qty — объём.
# Статусы:
#   ok         (по умолчанию) — однозначно эта строка и этот объём
#   ambiguous  — бот обязан спросить; candidates — все допустимые варианты
#   not_found  — такой позиции в смете нет, бот не должен ничего подставлять
#   clarify    — позиция понятна, но единицы не совпадают со сметой или объём не назван
#
# Правила (согласовано 2026-11-02):
#   - объём не назван: единственное число + позиция в «шт» → qty 1; иначе (м, кг, …) → clarify;
#   - любая названная работа вне сметы → not_found (пустой список — только если работ нет вовсе);
#   - пишем только в ту строку, которая названа: материал («кабель 3х2,5») — в строку материала,
#     работа («кабель на скобах») — в строку работы; парные строки работ (68–71) не дописываем;
#   - без явного материала («шестёрка», «девятка») — ambiguous по всем позициям с этим размером.
#
# Порядок упоминаний в expected не важен.
# ВАЖНО: не менять expected ради прохождения теста. Спорный эталон — обсудить и поправить осознанно.

# ───────────── Фреонопровод (медь) — строки 17/18/19: Д6,35 / Д9,52 / Д12,7 ─────────────
- id: cu-01
  tags: [copper]
  text: "медь 6-ка 15 м"
  expected: [{row: 17, qty: 15}]

- id: cu-02
  tags: [copper, ambiguous]
  text: "проложили шестёрку 20 метров"
  expected: [{status: ambiguous, candidates: [17, 20]}]   # «медь» не названа: медь или изоляция Д6,35

- id: cu-03
  tags: [copper, ambiguous]
  text: "девятку протянули 12м"
  expected: [{status: ambiguous, candidates: [18, 21, 33]}]   # медь Д9,52 / изоляция Д9,52 / капиллярка Ф9

- id: cu-04
  tags: [copper]
  text: "медная труба 9,52 — 8 метров"
  expected: [{row: 18, qty: 8}]

- id: cu-05
  tags: [copper]
  text: "фреонку 12.7 положили 30"
  expected: [{row: 19, qty: 30}]

- id: cu-06
  tags: [copper]
  text: "медь на 1/2 дюйма 10 м"
  expected: [{row: 19, qty: 10}]   # 1/2" = 12,7 мм

- id: cu-07
  tags: [copper]
  text: "трасса 1/4 и 3/8 по 14 метров"
  expected: [{row: 17, qty: 14}, {row: 18, qty: 14}]   # 1/4" = 6,35; 3/8" = 9,52

- id: cu-08
  tags: [copper, ambiguous]
  text: "медь проложили 25 метров"
  expected: [{status: ambiguous, candidates: [17, 18, 19]}]   # диаметр не назван

